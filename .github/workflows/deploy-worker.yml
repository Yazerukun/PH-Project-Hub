name: Deploy Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Require privileged-email vars
        shell: bash
        run: |
          if [[ -z "${{ secrets.OWNER_EMAILS }}" || -z "${{ secrets.ADMIN_EMAILS }}" ]]; then
            echo "::error::OWNER_EMAILS and ADMIN_EMAILS repository secrets must be set to the real values before deploying."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker && npm run deploy -- --var OWNER_EMAILS:"${{ secrets.OWNER_EMAILS }}" --var ADMIN_EMAILS:"${{ secrets.ADMIN_EMAILS }}"
